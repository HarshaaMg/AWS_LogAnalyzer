services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: log-analyzer-backend
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local-secret-key-for-development}
      - STORAGE_MODE=${STORAGE_MODE:-local}
      - PROVISIONER_TYPE=${PROVISIONER_TYPE:-vmware}
      - AUTO_SCALING_ENABLED=${AUTO_SCALING_ENABLED:-true}
      - DRY_RUN_MODE=${DRY_RUN_MODE:-true}
      - MIN_VM_COUNT=${MIN_VM_COUNT:-1}
      - MAX_VM_COUNT=${MAX_VM_COUNT:-5}
      - COOLDOWN_PERIOD=${COOLDOWN_PERIOD:-300}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/local_storage:/app/local_storage
    restart: unless-stopped
    networks:
      - log-analyzer-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: log-analyzer-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - log-analyzer-network

networks:
  log-analyzer-network:
    driver: bridge
